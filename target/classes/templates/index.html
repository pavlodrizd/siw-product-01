<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIW-Prodotti - Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="hero-body"> <div th:replace="~{navbar :: navbar}"></div>

    <div class="hero-container">
        <video autoplay muted loop id="bg-video">
            <source src="/videos/backgroundSiwProduct.mp4" type="video/mp4">
        </video>
        <div class="hero-content">
            <h1>Esplora il nostro <span class="accent-text">Catalogo</span></h1>
            <form th:action="@{/search}" method="get" class="combined-search-form">
                <input type="search" name="query" class="form-control search-input" placeholder="Cerca un prodotto per nome...">
                <select name="typeId" class="form-select search-select">
                    <option value="">Tipologia</option>
                    <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}"></option>
                </select>
                <button type="submit" class="btn search-button"><i class="bi bi-search"></i></button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
