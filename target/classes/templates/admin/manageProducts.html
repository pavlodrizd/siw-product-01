<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestione Prodotti</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <style>
        .table {
            background-color: var(--background-mid);
        }
        .table th {
            color: var(--accent-cyan);
        }
        .btn-custom {
            background-color: var(--accent-purple);
            color: var(--text-primary);
            font-weight: bold;
            border: none;
            transition: background-color 0.3s;
        }
        .btn-custom:hover {
            background-color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div th:replace="~{navbar :: navbar}"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Gestione Prodotti</h1>
            <a th:href="@{/admin/addProduct}" class="btn btn-custom">Aggiungi Nuovo Prodotto</a>
        </div>

        <div th:if="${products.isEmpty()}" class="alert alert-info bg-transparent text-white text-center">
            Non ci sono prodotti nel catalogo.
        </div>

        <table class="table table-dark table-striped align-middle table-hover" th:unless="${products.isEmpty()}">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome Prodotto</th>
                    <th scope="col">Prezzo</th>
                    <th scope="col">Tipologia</th>
                    <th scope="col" class="text-center">Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <th scope="row" th:text="${product.id}">1</th>
                    <td th:text="${product.name}">Nome Prodotto</td>
                    <td th:text="'€ ' + ${#numbers.formatDecimal(product.price, 1, 2)}">€0.00</td>
                    <td th:text="${product.type.name}">Nome Tipologia</td>
					<td class="text-center">
					    <a th:href="@{/admin/editProduct/{id}(id=${product.id})}" ...>Modifica</a>
					    <form th:action="@{/admin/deleteProduct/{id}(id=${product.id})}" method="post" class="d-inline"
					          onsubmit="return confirm('Sei sicuro di voler eliminare questo prodotto?');">
					        
					        <input type="hidden" name="source" value="dashboard">
					        
					        <button type="submit" class="btn btn-danger btn-sm">Elimina</button>
					    </form>
					</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
