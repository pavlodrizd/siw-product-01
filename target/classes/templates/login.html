<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SIW Prodotti</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro:wght@600&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    
    <style>
        body, html {
            height: 100%;
        }
        .form-container {
            min-height: calc(100vh - 74px); /* Altezza viewport meno navbar */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background-color: var(--background-mid);
            border: 1px solid var(--accent-purple);
            border-radius: 15px;
            max-width: 800px;
            width: 100%;
        }
        .auth-form-control {
            background-color: rgba(0,0,0,0.3);
            border: 1px solid var(--accent-purple);
            color: var(--text-primary);
        }
        .auth-form-control:focus {
            background-color: rgba(0,0,0,0.5);
            color: var(--text-primary);
            box-shadow: none;
        }
        .btn-auth {
            background-color: var(--accent-purple);
            color: var(--text-primary);
            font-weight: bold;
            border: none;
            transition: background-color 0.3s;
        }
        .btn-auth:hover {
            background-color: var(--accent-cyan);
        }
        .auth-card-img {
            object-fit: cover;
            height: 100%;
            border-radius: 0 15px 15px 0;
        }
    </style>
</head>
<body>

    <div th:replace="~{navbar :: navbar}"></div>

    <div class="container form-container">
        <div class="card auth-card">
            <div class="row g-0">
                <div class="col-md-6 p-4 p-lg-5">
                    <h2 class="text-center mb-4">Accedi</h2>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <input type="text" class="form-control auth-form-control" id="username" name="username" placeholder="Email" required />
                        </div>
                        <div class="mb-3">
                            <input type="password" id="password" name="password" class="form-control auth-form-control" placeholder="Password" required />
                        </div>

                        <div th:if="${param.error != null}" class="alert alert-danger text-center p-2">
                            <p class="mb-0">Username o password errati</p>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-auth">Login</button>
                        </div>
                        <div class="text-center mt-3">
                            <small class="text-white">Non hai un account? <a th:href="@{/register}" style="color: var(--accent-cyan);">Registrati</a></small>
                        </div>
                    </form>
                </div>
                <div class="col-md-6 d-none d-md-block">
                    <img th:src="@{/images/immagineLogin.png}" class="img-fluid auth-card-img" alt="Login Image">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
