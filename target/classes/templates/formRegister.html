<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrazione - Catalogo Prodotti</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    
    <style>
        body, html { height: 100%; }
        .form-container {
            min-height: calc(100vh - 74px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .auth-card {
            background-color: var(--background-mid);
            border: 1px solid var(--accent-purple);
            border-radius: 15px;
            max-width: 900px;
            width: 100%;
        }
        .auth-form-control {
            background-color: rgba(0,0,0,0.3);
            border: 1px solid var(--accent-purple);
            color: var(--text-primary);
        }
        .auth-form-control:focus {
            background-color: rgba(0,0,0,0.5);
            color: var(--text-primary);
            box-shadow: none;
        }
        .btn-auth {
            background-color: var(--accent-purple);
            color: var(--text-primary);
            font-weight: bold;
            border: none;
            transition: background-color 0.3s;
        }
        .btn-auth:hover { background-color: var(--accent-cyan); }
        .auth-card-img {
            object-fit: cover;
            height: 100%;
            border-radius: 15px 0 0 15px;
        }
    </style>
</head>
<body>

    <div th:replace="~{navbar :: navbar}"></div>

    <div class="container form-container">
        <div class="card auth-card">
            <div class="row g-0">
                <div class="col-md-6 d-none d-md-block">
                    <img th:src="@{/images/immagineRegister.png}" class="img-fluid auth-card-img" alt="Register Image">
                </div>
                <div class="col-md-6 p-4 p-lg-5">
                    <h2 class="text-center mb-4">Crea il tuo Account</h2>
                    
                    <form th:action="@{/register}" method="post">
                        
                        <div class="mb-3">
                            <input type="email" th:field="${credentials.email}" class="form-control auth-form-control" placeholder="La tua email" required />
                            <div th:if="${#fields.hasErrors('credentials.email')}" th:errors="${credentials.email}" class="text-danger small mt-1"></div>
                        </div>
                        <div class="mb-3">
                            <input type="password" th:field="${credentials.password}" class="form-control auth-form-control" placeholder="Password" required />
                            <div th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input type="text" th:field="${user.name}" class="form-control auth-form-control" placeholder="Il tuo nome" required />
                                <div th:if="${#fields.hasErrors('user.name')}" th:errors="${user.name}" class="text-danger small mt-1"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="text" th:field="${user.surname}" class="form-control auth-form-control" placeholder="Il tuo cognome" required />
                                <div th:if="${#fields.hasErrors('user.surname')}" th:errors="${user.surname}" class="text-danger small mt-1"></div>
                            </div>
                        </div>

                        <div th:if="${param.error != null}" class="alert alert-danger text-center p-2">
                            <p class="mb-0">L'email inserita è già utilizzata.</p>
                        </div>
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-auth">Registrati</button>
                        </div>
                        <div class="text-center mt-3">
                            <small class="text-white">Sei già dei nostri? <a th:href="@{/login}" style="color: var(--accent-cyan);">Accedi</a></small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
