<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Prodotto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <style>
        .form-container {
            max-width: 800px;
            margin: 2rem auto;
            background-color: var(--background-mid);
            padding: 2.5rem;
            border-radius: 15px;
            border: 1px solid var(--accent-purple);
        }
        .form-control, .form-select {
            background-color: rgba(0,0,0,0.3);
            border: 1px solid var(--accent-purple);
            color: var(--text-primary);
        }
        .form-control:focus, .form-select:focus {
            background-color: rgba(0,0,0,0.5);
            box-shadow: none;
            color: var(--text-primary);
        }
        .btn-submit {
            background-color: var(--accent-purple);
            color: var(--text-primary);
            font-weight: bold;
            border: none;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-4" th:text="'Modifica: ' + ${product.name}">Modifica Prodotto</h2>
            
            <form th:action="@{/admin/editProduct/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="name" class="form-label">Nome Prodotto</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">Prezzo (€)</label>
                    <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Descrizione</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                </div>
                
                <div class="mb-3 p-3 border rounded" style="border-color: var(--accent-purple) !important;">
                    <label class="form-label">Tipologia</label>
                    <div class="mb-2">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="typeSelectionMode" id="existingTypeRadio" value="existing" checked>
                            <label class="form-check-label" for="existingTypeRadio">Scegli Esistente</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="typeSelectionMode" id="newTypeRadio" value="new">
                            <label class="form-check-label" for="newTypeRadio">Crea Nuova</label>
                        </div>
                    </div>
                    <div id="existingTypeBlock">
                        <select id="typeSelect" th:field="*{type}" class="form-select" required>
                            <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}"></option>
                        </select>
                    </div>
                    <div id="newTypeBlock" style="display: none;">
                        <input type="text" id="newTypeNameInput" name="newTypeName" class="form-control" placeholder="Nome nuova tipologia">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="imageFile" class="form-label">Cambia Immagine (opzionale)</label>
                    <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/png, image/jpeg" />
                    <div class="mt-2" th:if="${product.imagePath}">
                        <p class="mb-1 small">Immagine attuale:</p>
                        <img th:src="@{'/images/products/' + ${product.imagePath}}" alt="Immagine attuale" style="max-width: 100px; border-radius: 5px;">
                    </div>
                </div>

                <div th:if="${messaggioErrore}" class="alert alert-danger text-center p-2 mb-3">
                    <p class="mb-0" th:text="${messaggioErrore}"></p>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-submit btn-lg px-5">Salva Modifiche</button>
                    <a th:href="@{/admin/manageProducts}" class="btn btn-secondary ms-2">Annulla</a>
                </div>
            </form>
        </div>
    </div>
    
    <script th:src="@{/js/formTypeHelper.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
