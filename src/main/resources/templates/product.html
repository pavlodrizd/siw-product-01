<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="${product.name} + ' - Catalogo Prodotti'">Dettaglio Prodotto</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro:wght@600&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<style>
		.product-view {
			display: flex;
			gap: 50px;
			margin-bottom: 60px;
		}

		.product-image {
		    flex: 0 0 300px; /* Non si espande, non si restringe, base di 300px */
		    width: 300px;
		    height: 450px; /* Altezza fissa per un look da "libro" */
		}

		/* MODIFICA 2: L'immagine si adatta al contenitore fisso */
		.product-image img { 
		    width: 100%; 
		    height: 100%;
		    object-fit: fill; /* Si "stira" per riempire lo spazio, come richiesto */
		    border-radius: 15px; 
		    border: 2px solid var(--accent-purple); 
		}

		.product-info {
			flex: 1;
		}

		.admin-actions {
			position: absolute;
			top: 10px;
			right: 10px;
			z-index: 10;
		}

		.product-info h1 {
			color: var(--text-primary);
			font-size: 3rem;
		}

		.product-info .category {
			color: var(--accent-cyan);
			font-weight: bold;
			text-transform: uppercase;
			font-size: 0.9em;
			letter-spacing: 1px;
		}

		.product-info .price {
			font-size: 2.8rem;
			font-weight: bold;
			color: var(--accent-cyan);
			margin: 20px 0;
		}

		.product-info .description {
			color: #d1d1d1;
			margin-bottom: 30px;
		}

		.cta-button {
			background-color: var(--accent-purple);
			color: var(--text-primary);
			border: none;
			padding: 15px 30px;
			border-radius: 50px;
			font-size: 1em;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.cta-button:hover {
			transform: scale(1.05);
			background-color: var(--accent-cyan);
		}

		.section h2 {
			border-bottom: 1px solid rgba(127, 90, 240, 0.3);
			padding-bottom: 15px;
			margin-bottom: 30px;
			color: var(--accent-purple);
		}

		.comment {
			background-color: var(--background-mid);
			padding: 20px;
			border-radius: 10px;
			margin-top: 20px;
			border-left: 4px solid var(--accent-purple);
		}

		.comment h5 {
			color: var(--accent-cyan);
		}

		.comment p {
			margin: 0;
			color: #d1d1d1;
		}

		@media (max-width: 768px) {
			.product-view {
				flex-direction: column;
			}
		}

		/* ======================================================= */
		/* STILI PER LE CARD DEI PRODOTTI SIMILI (CON MODIFICHE) */
		/* ======================================================= */
		.similar-product-card {
			            background-color: var(--background-mid);
			            border: 1px solid rgba(127, 90, 200, 0.3);
			            border-radius: 10px;
			            overflow: hidden;
			            transition: transform 0.3s, box-shadow 0.3s;
			        }
			        .similar-product-card:hover {
			            transform: translateY(-5px);
			            box-shadow: 0 8px 15px rgba(127, 90, 240, 0.15);
			        }
			        .similar-product-card img {
			            width: 100%;
			            aspect-ratio: 2 / 3;
			            object-fit: fill;
			            background-color: #333;
			        }
			        .similar-product-card .card-body {
			            padding: 0.75rem 1rem;
			            display: flex;
			            justify-content: space-between;
			            align-items: center;
			        }

		/* Stile per il link del titolo */
		.card-title-link {
			color: var(--text-primary);
			text-decoration: none;
			/* Permette al titolo di occupare lo spazio disponibile, troncandosi se necessario */
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.card-title-link:hover {
			color: var(--accent-cyan);
		}

		.similar-product-card .card-title {
			font-size: 1rem;
			margin: 0;
		}

		/* MODIFICA: Rimosso il posizionamento assoluto */
		.delete-similar-form {
			flex-shrink: 0;
			/* Impedisce al pulsante di rimpicciolirsi */
			margin-left: 0.5rem;
			/* Aggiunge un po' di spazio dal titolo */
		}

		.delete-similar-form button {
			background-color: rgba(220, 53, 69, 0.8);
			color: white;
			border: none;
			border-radius: 50%;
			width: 24px;
			height: 24px;
			font-size: 16px;
			line-height: 24px;
			text-align: center;
			padding: 0;
			cursor: pointer;
			transition: all 0.2s;
		}

		.delete-similar-form button:hover {
			background-color: #dc3545;
			transform: scale(1.1);
		}

		.action-buttons-container {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			/* Permette ai pulsanti di andare a capo su schermi piccoli */
			gap: 1rem;
			/* Aggiunge spazio tra i gruppi di pulsanti */
		}

		/* ======================================================= */
		/* STILI AGGIUNTIVI PER LA SEZIONE COMMENTI              */
		/* ======================================================= */

		/* Stile per il titolo del commento */
		.comment-title {
			color: var(--accent-cyan);
			font-weight: bold;
			margin-bottom: 0.5rem;
		}

		/* Stile per il testo del commento (più piccolo) */
		.comment-text {
			color: #d1d1d1;
			font-size: 0.95rem;
			/* Leggermente più piccolo del testo normale */
			margin-bottom: 1rem;
			line-height: 1.6;
		}

		/* Contenitore per il footer che allinea autore e pulsanti */
		.comment-footer {
			display: flex;
			justify-content: space-between;
			/* Spinge gli elementi ai lati opposti */
			align-items: center;
			/* Allinea verticalmente gli elementi */
			margin-top: 1rem;
		}

		/* Rimuove il margine dal footer di Bootstrap perché ora è gestito dal contenitore */
		.comment-footer .blockquote-footer {
			margin-top: 0;
			margin-bottom: 0;
			/* Aggiunto per coerenza */
		}
	</style>
</head>

<body>

	<div th:replace="~{navbar :: navbar}"></div>

	<div class="container my-5">
		<main>
			<section class="product-view">
				<div class="product-image">
					<th:block th:if="${product.imagePath != null}">
						<img th:src="@{'/images/products/' + ${product.imagePath}}" alt="Immagine Prodotto">
					</th:block>
					<th:block th:unless="${product.imagePath != null}">
						<img th:src="@{https://via.placeholder.com/600x600.png/1A1A2E/7F5AF0?text=Immagine}"
							alt="Immagine non disponibile">
					</th:block>
				</div>
				<div class="product-info">
					<h1 th:text="${product.name}">Nome Prodotto</h1>
					<p class="category">Tipologia: <a th:href="@{/type/{id}(id=${product.type.id})}"
							th:text="${product.type.name}" style="color: var(--accent-cyan);"></a></p>
					<div class="price" th:text="'€ ' + ${#numbers.formatDecimal(product.price, 1, 2)}">€ 0.00</div>

					<div class="action-buttons-container mb-4">

						<div sec:authorize="hasRole('ADMIN')" class="d-inline-block">
							<a th:href="@{/admin/editProduct/{id}(id=${product.id})}" class="btn btn-warning">Modifica
								Prodotto</a>
							<form th:action="@{/admin/deleteProduct/{id}(id=${product.id})}" method="post"
								class="d-inline"
								onsubmit="return confirm('Sei sicuro di voler eliminare questo prodotto? L\'azione è irreversibile.');">
								<button type="submit" class="btn btn-danger">Elimina Prodotto</button>
							</form>
						</div>

						<a sec:authorize="isAuthenticated()"
							th:href="@{/products/{productId}/comments/new(productId=${product.id})}"
							class="cta-button">Lascia un commento</a>

					</div>

					<p class="description" th:text="${product.description}">Descrizione del prodotto.</p>

				</div>
			</section>
		</main>

		<section class="section">
			<h2>Prodotti Simili</h2>
			<div sec:authorize="hasRole('ADMIN')" class="mb-4">
				<form th:action="@{/admin/addSimilarProduct}" method="post" class="d-flex gap-2">
					<input type="hidden" name="productId" th:value="${product.id}" />
					<select name="similarProductId" class="form-select"
						style="background-color: var(--background-mid); color: var(--text-primary); border-color: var(--accent-purple);"
						required>
						<option value="" selected disabled>Aggiungi un prodotto simile...</option>
						<option th:each="p : ${allProducts}" th:value="${p.id}" th:text="${p.name}"></option>
					</select>
					<button type="submit" class="btn btn-sm"
						style="background-color: var(--accent-purple); color: var(--text-primary);">Aggiungi</button>
				</form>
			</div>

			<div th:if="${product.similarProducts.isEmpty()}" class="alert alert-info bg-transparent text-white">
				Non ci sono prodotti simili associati.
			</div>

			<div class="row g-4" th:unless="${product.similarProducts.isEmpty()}">
				<div class="col-md-2 col-lg-2" th:each="similar : ${product.similarProducts}">
					<div class="similar-product-card">

						<a th:href="@{/product/{id}(id=${similar.id})}">
							<th:block th:if="${similar.imagePath != null}">
								<img th:src="@{'/images/products/' + ${similar.imagePath}}" alt="Immagine Prodotto">
							</th:block>
							<th:block th:unless="${similar.imagePath != null}">
								<img th:src="@{https://via.placeholder.com/400x300.png/1A1A2E/7F5AF0?text=Prodotto}"
									alt="Immagine non disponibile">
							</th:block>
						</a>

						<div class="card-body">
							<a th:href="@{/product/{id}(id=${similar.id})}" class="card-title-link">
								<h5 class="card-title" th:text="${similar.name}"></h5>
							</a>
							<form
								th:action="@{/admin/product/{productId}/removeSimilar/{similarProductId}(productId=${product.id}, similarProductId=${similar.id})}"
								method="post" class="delete-similar-form" sec:authorize="hasRole('ADMIN')"
								onsubmit="return confirm('Rimuovere questo prodotto dai simili?');">
								<button type="submit" title="Rimuovi">×</button>
							</form>
						</div>
					</div>
				</div>
			</div>

		</section>

		<section class="section mt-5">
			<h2>Commenti dalla Community</h2>
			<div class="comments-list mt-4">
				<div th:if="${product.comments.isEmpty()}" class="alert alert-info bg-transparent text-white">
					Non ci sono ancora commenti per questo prodotto.
				</div>
				<article class="comment" th:each="comment : ${product.comments}">

					<h5 class="comment-title" th:text="${comment.title}">Titolo del commento</h5>

					<p class="comment-text" th:text="${comment.text}">Testo del commento...</p>

					<div class="comment-footer">
						<footer class="blockquote-footer" th:text="'Scritto da: ' + ${comment.author.name}"></footer>

						<div class="comment-actions"
							th:if="${#authorization.expression('hasRole(''ADMIN'')') or 
						              (#authorization.expression('isAuthenticated()') and #authentication.principal.username == comment.author.credentials.email)}">
							<a th:href="@{/comment/{id}/edit(id=${comment.id})}"
								class="btn btn-sm btn-outline-warning me-2">Modifica</a>
							<form th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post" class="d-inline"
								onsubmit="return confirm('Sei sicuro?');">
								<button type="submit" class="btn btn-sm btn-outline-danger">Elimina</button>
							</form>
						</div>
					</div>

				</article>
			</div>
		</section>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
