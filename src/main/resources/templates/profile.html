<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Profilo Utente</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .profile-header {
            background: var(--background-mid);
            border: 1px solid var(--accent-purple);
            border-radius: 15px;
            padding: 2rem;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            background-color: var(--accent-purple);
            color: var(--text-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
        }
        .btn-edit-profile {
            background-color: transparent;
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            transition: all 0.3s;
        }
        .btn-edit-profile:hover {
            background-color: var(--accent-purple);
            color: var(--text-primary);
        }
        .comment-card {
            background-color: var(--background-mid);
            border-left: 4px solid var(--accent-purple);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div th:replace="~{navbar :: navbar}"></div>

    <div class="container my-5">
        
        <!-- MESSAGGI DI SUCCESSO/ERRORE -->
        <div th:if="${success_message}" class="alert alert-success" th:text="${success_message}"></div>
        <div th:if="${error_message}" class="alert alert-danger" th:text="${error_message}"></div>

        <!-- NUOVA CARD PROFILO RIDISEGNATA -->
        <div class="profile-header d-flex align-items-center gap-4 mb-5">
            <div class="profile-avatar" th:text="${#strings.substring(user.name, 0, 1)}"></div>
            <div class="flex-grow-1">
                <h1 class="mb-0" th:text="${user.name} + ' ' + ${user.surname}"></h1>
                <p class="text-white-50 mb-0" th:text="${user.credentials.email}"></p>
            </div>
            <div>
                <a th:href="@{/profile/edit}" class="btn btn-edit-profile">Modifica Profilo</a>
            </div>
        </div>

        <!-- VISTA COMMENTI PER UTENTE NORMALE -->
        <div sec:authorize="!hasRole('ADMIN')">
            <h2 class="mb-4">I tuoi Commenti</h2>
            <div th:if="${userComments.isEmpty()}" class="alert alert-info bg-transparent text-white">
                Non hai ancora scritto nessun commento.
            </div>
            <div class="list-group" th:unless="${userComments.isEmpty()}">
                <div th:each="comment : ${userComments}" class="list-group-item comment-card text-white mb-3 p-3">
                    <h5 th:text="${comment.title}" style="color: var(--accent-cyan);"></h5>
                    <p th:text="${comment.text}" class="mb-2"></p>
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-white-50">Sul prodotto: <a th:href="@{'/product/' + ${comment.product.id}}" th:text="${comment.product.name}" style="color: var(--accent-cyan);"></a></small>
                        <div>
                            <a th:href="@{/comment/{id}/edit(id=${comment.id})}" class="btn btn-sm btn-outline-warning me-2">Modifica</a>
                            <form th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post" class="d-inline" onsubmit="return confirm('Sei sicuro?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Elimina</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- NUOVA VISTA COMMENTI PER ADMIN (NON PIÙ TABELLA) -->
        <div sec:authorize="hasRole('ADMIN')">
            <h2 class="mb-4">Tutti i Commenti del Sito</h2>
            <div th:if="${allComments.isEmpty()}" class="alert alert-info bg-transparent text-white">
                Non ci sono commenti sul sito.
            </div>
            <div class="list-group" th:unless="${allComments.isEmpty()}">
                <div th:each="comment : ${allComments}" class="list-group-item comment-card text-white mb-3 p-3">
                    <h5 th:text="${comment.title}" style="color: var(--accent-cyan);"></h5>
                    <p th:text="${comment.text}" class="mb-2"></p>
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-white-50">
                            <strong>Autore:</strong> <span th:text="${comment.author.name}"></span> | 
                            <strong>Prodotto:</strong> <a th:href="@{'/product/' + ${comment.product.id}}" th:text="${comment.product.name}" style="color: var(--accent-cyan);"></a>
                        </small>
                        <div>
                            <a th:href="@{/comment/{id}/edit(id=${comment.id})}" class="btn btn-sm btn-outline-warning me-2">Modifica</a>
                            <form th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post" class="d-inline" onsubmit="return confirm('Sei sicuro?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Elimina</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
