<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Commento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .form-container { 
            max-width: 800px; 
            margin: 2rem auto; 
            background-color: var(--background-mid); 
            padding: 2.5rem; 
            border-radius: 15px; 
            border: 1px solid var(--accent-purple); 
        }
        .form-control { 
            background-color: rgba(0,0,0,0.3); 
            border: 1px solid var(--accent-purple); 
            color: var(--text-primary); 
        }
        .btn-submit { 
            background-color: var(--accent-purple); 
            color: var(--text-primary); 
            font-weight: bold; 
            border: none; 
            transition: background-color 0.3s; 
        }
        .btn-submit:hover { 
            background-color: var(--accent-cyan); 
        }
        .error {
            color: #FF6B6B; /* Mantenuto lo stile per gli errori */
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-4">Lascia un Commento</h2>
            
            <form th:action="@{/products/{productId}/comments(productId=${product.id})}" th:object="${comment}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label">Titolo</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Inserisci un titolo" required />
                    <div th:if="${#fields.hasErrors('title')}" class="error mt-1" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label for="text" class="form-label">Testo</label>
                    <textarea id="text" th:field="*{text}" class="form-control" rows="5" placeholder="Scrivi il tuo commento..." required></textarea>
                    <div th:if="${#fields.hasErrors('text')}" class="error mt-1" th:errors="*{text}"></div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-submit px-5">Invia Commento</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
