<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

  <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">SIW-Prodotti</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
		
			<li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
				<a class="nav-link dropdown-toggle nav-link-admin" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
				    Area Admin
				</a>
			    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarAdminDropdown" style="background-color: #16213E; border-color: #7F5AF0;">
			        <li><a class="dropdown-item" th:href="@{/admin/addProduct}">Aggiungi Prodotto</a></li>
			        <li><a class="dropdown-item" th:href="@{/admin/manageProducts}">Gestisci Prodotti</a></li>
			    </ul>
			</li>
          
          <li class="nav-item"><a class="nav-link" th:href="@{/products}">Catalogo</a></li>
          
          <li class="nav-item" sec:authorize="isAnonymous()">
            <a class="nav-link" th:href="@{/login}">Login</a>
          </li>

          <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" th:href="@{/profile}">Profilo</a>
          </li>
          

          
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" th:href="@{/logout}">Logout</a>
          </li>
          
        </ul>
      </div>
    </div>
  </nav>
  
</body>
</html>
