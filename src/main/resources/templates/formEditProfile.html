<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifica Profilo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .form-container { max-width: 800px; margin: 2rem auto; background-color: var(--background-mid); padding: 2.5rem; border-radius: 15px; border: 1px solid var(--accent-purple); }
        .form-control { background-color: rgba(0,0,0,0.3); border: 1px solid var(--accent-purple); color: var(--text-primary); }
        .btn-submit { background-color: var(--accent-purple); color: var(--text-primary); font-weight: bold; border: none; transition: background-color 0.3s; }
        .btn-submit:hover { background-color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>
    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-4">Modifica i tuoi Dati</h2>
            <form th:action="@{/profile/edit}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" id="name" name="name" class="form-control" th:value="${user.name}" required />
                </div>
                 <div class="mb-3">
                    <label for="surname" class="form-label">Cognome</label>
                    <input type="text" id="surname" name="surname" class="form-control" th:value="${user.surname}" required />
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" th:value="${credentials.email}" required />
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-submit px-5">Salva Modifiche</button>
                    <a th:href="@{/profile}" class="btn btn-secondary ms-2">Annulla</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
